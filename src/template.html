<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Odin ToDo</title>
    </head>
    <body>
        <div id="projectSection">
            <h1 id="projectHeader">Projects</h1>
            <div id="projectContainer">
                
            </div>
            <button class="addItem">Add Project +</button>
        </div>
        <div id="toDoSection">
            <h1 id="toDoHeader"></h1>
            <div id="toDoContainer">
            </div>
            <button class="addItem">Add To Do +</button>
        </div>
            
        <dialog id="projectModal" closeby="none">
            <form method="dialog">
                <button class="dialogClose" type="button"></button>

                <div class="entryPair">
                    <label for="name">New Title: </label>
                    <input id="name" type="text" autofocus>
                </div>

                <button class="dialogSubmit" type="submit">Submit</button>

            </form>
        </dialog>

        <dialog id="toDoModal" closeby="none">
            <form method="dialog">
                <button class="dialogClose" type="button"></button>

                <div class="entryPair">
                    <label for="title">Title: </label>
                    <input id="title" type="text" autofocus>
                </div>

                <div class="entryPair">
                    <label for="date">Date: </label>
                    <input id="date" type="date">
                </div>

                <div class="entryPair">
                    <label for="priority">Priority: </label>
                    <select id="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="entryPair">
                    <label for="notes">Notes: </label>
                    <textarea id="notes" rows="10" cols="30">Notes</textarea>
                </div>

                <button class="dialogSubmit" type="submit">Submit</button>

            </form>
        </dialog>

    </body>
</html>
